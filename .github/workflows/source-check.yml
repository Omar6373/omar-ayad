name: Pawn source checks
on:
  push:
  pull_request:
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project structure and basic safety checks
        shell: bash
        run: |
          set -euo pipefail
          test -s gamemodes/omarrp.pwn
          test -s database/schema.sql
          test -s maps/omar_district.inc
          python3 scripts/check_project.py
      - name: Note
        run: echo "Static checks only. Pawn compilation and Android gameplay require installed open.mp/MySQL/bcrypt dependencies."
